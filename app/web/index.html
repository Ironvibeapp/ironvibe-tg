<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="IronVibe — offline-first workout tracker inside Telegram.">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="IronVibe">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>IronVibe</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #121212;
    }
    #iv-boot {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      box-sizing: border-box;
      color: #e8e4dc;
      font-family: system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-align: center;
    }
  </style>

  <script src="https://telegram.org/js/telegram-web-app.js?57"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('offline_sw.js').catch(function () {});
    }
  </script>
</head>
<body>
  <div id="iv-boot">IRONVIBE</div>
  <script>
    (function () {
      var boot = document.getElementById('iv-boot');
      function show(text) {
        if (boot) boot.textContent = text;
      }
      window.ironVibeHideBoot = function () {
        if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        boot = null;
      };
      window.addEventListener('error', function (ev) {
        show('Error: ' + (ev.message || 'script'));
      });
      window.addEventListener('unhandledrejection', function (ev) {
        var r = ev.reason;
        show('Error: ' + (r && r.message ? r.message : String(r)));
      });
      setTimeout(function () {
        if (boot) show('Loading…');
      }, 2500);
    })();
  </script>
  <script src="flutter_bootstrap.js"></script>
</body>
</html>
