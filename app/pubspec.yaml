name: fitness_app
description: IronVibe Telegram Mini App — offline-first workout tracker. Local writes, Telegram CloudStorage sync when online.
publish_to: 'none'

version: 1.7.4+74

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  share_plus: ^11.0.0
  url_launcher: ^6.2.5
  fl_chart: ^1.2.0
  intl: ^0.20.2
  file_picker: ^10.3.10
  uuid: ^4.5.1
  audioplayers: ^6.6.0
  flutter_svg: ^2.2.3
  pdf: ^3.11.3
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/app_icon.png
    - assets/logo_final.png
    - assets/logo_on_light.svg
    - assets/logo_on_dark.svg
    - assets/sounds/timer_tick.wav
    - assets/sounds/timer_phase.wav
    - assets/rhythm_smirk.png
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf
    - assets/fonts/NotoSansSC-Regular.ttf
